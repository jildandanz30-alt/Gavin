<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel — Gavin Dsn</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* ── Layout ── */
        .admin-login  { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
        .admin-panel  { display:none; }
        .page-wrap    { position:relative; z-index:1; padding:80px 16px 60px; max-width:960px; margin:0 auto; }

        /* ── Tab navigation ── */
        .admin-tabs { display:flex; gap:8px; margin-bottom:24px; border-bottom:1px solid var(--border2); padding-bottom:0; flex-wrap:wrap; }
        .admin-tab  { padding:10px 20px; border:none; background:transparent; color:var(--text2); font-family:'Space Grotesk',sans-serif; font-size:0.88rem; font-weight:600; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; transition:all 0.2s; }
        .admin-tab:hover  { color:var(--neon); }
        .admin-tab.active { color:var(--neon); border-bottom-color:var(--neon); }

        /* ── Stats ── */
        .stats-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:12px; margin-bottom:24px; }
        .stat-card { background:var(--card); border:1px solid var(--border2); border-radius:10px; padding:16px; text-align:center; }
        .stat-card .num { font-size:1.6rem; font-weight:800; color:var(--neon); }
        .stat-card .lbl { font-size:0.7rem; color:var(--text2); text-transform:uppercase; letter-spacing:1px; margin-top:3px; }

        /* ── Filter tabs ── */
        .filter-tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
        .tab-btn { padding:7px 16px; border-radius:20px; font-size:0.78rem; font-weight:600; cursor:pointer; transition:all 0.2s; border:1px solid var(--border2); background:transparent; color:var(--text2); font-family:'Space Grotesk',sans-serif; }
        .tab-btn.active, .tab-btn:hover { background:var(--neon); color:#fff; border-color:var(--neon); }

        /* ── Order cards ── */
        .order-card { background:var(--card); border:1px solid var(--border2); border-radius:12px; margin-bottom:12px; overflow:hidden; }
        .order-head { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--border2); flex-wrap:wrap; gap:8px; }
        .order-id-txt { font-size:0.82rem; font-weight:800; color:var(--neon); }
        .order-date   { font-size:0.72rem; color:var(--text2); }
        .order-body   { padding:14px 16px; }
        .order-info-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
        .order-info-item { background:var(--bg3); border-radius:6px; padding:8px 10px; }
        .order-info-label { font-size:0.68rem; color:var(--text2); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:3px; }
        .order-info-value { font-weight:700; color:var(--text); font-size:0.82rem; }
        .bukti-wrap h4 { font-size:0.75rem; font-weight:700; color:var(--text2); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; margin-top:12px; }
        .bukti-img { max-width:100%; max-height:280px; border-radius:10px; border:1px solid var(--border2); cursor:pointer; object-fit:contain; display:block; }
        .no-bukti  { background:var(--bg3); border:1px dashed var(--border2); border-radius:8px; padding:16px; text-align:center; font-size:0.82rem; color:var(--text2); }
        .action-buttons { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
        .btn-approve { padding:9px 20px; background:var(--success); color:#fff; border:none; border-radius:8px; font-size:0.82rem; font-weight:700; cursor:pointer; transition:all 0.2s; font-family:'Space Grotesk',sans-serif; }
        .btn-approve:hover { opacity:0.85; }
        .btn-reject  { padding:9px 20px; background:var(--error);   color:#fff; border:none; border-radius:8px; font-size:0.82rem; font-weight:700; cursor:pointer; transition:all 0.2s; font-family:'Space Grotesk',sans-serif; }
        .btn-reject:hover  { opacity:0.85; }
        .btn-wa-buyer{ padding:9px 20px; background:#25d366; color:#fff; border:none; border-radius:8px; font-size:0.82rem; font-weight:700; cursor:pointer; transition:all 0.2s; font-family:'Space Grotesk',sans-serif; }
        .approved-badge { padding:9px 16px; background:rgba(34,197,94,0.1); border:1px solid rgba(34,197,94,0.3); color:var(--success); border-radius:8px; font-size:0.82rem; font-weight:700; }
        .empty-box { text-align:center; padding:50px 20px; color:var(--text2); background:var(--card); border:1px dashed var(--border2); border-radius:12px; }

        /* ── Badge variants ── */
        .badge-blue    { background:rgba(74,158,202,0.12); border:1px solid rgba(74,158,202,0.3); color:var(--neon); }

        /* ── Image modal ── */
        .img-modal { position:fixed; inset:0; background:rgba(0,0,0,0.88); z-index:9999; display:none; align-items:center; justify-content:center; padding:20px; cursor:pointer; }
        .img-modal.open { display:flex; }
        .img-modal img  { max-width:100%; max-height:90vh; border-radius:10px; object-fit:contain; }

        /* ── Login card ── */
        .login-wrap { width:100%; max-width:360px; }
        .login-wrap h2 { font-size:1.4rem; font-weight:800; margin-bottom:4px; }
        .login-wrap p  { color:var(--text2); font-size:0.85rem; margin-bottom:24px; }

        /* ════════════════════════════
           PRODUCT MANAGEMENT STYLES
           ════════════════════════════ */
        #tabProducts { display:none; }

        .prod-toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:20px; flex-wrap:wrap; }
        .btn-add-prod { padding:10px 22px; background:linear-gradient(135deg,var(--neon),#1a5aa0); color:#fff; border:none; border-radius:10px; font-family:'Space Grotesk',sans-serif; font-size:0.88rem; font-weight:700; cursor:pointer; transition:all 0.2s; display:flex; align-items:center; gap:8px; }
        .btn-add-prod:hover { opacity:0.88; transform:translateY(-1px); }
        .btn-add-prod svg { width:16px; height:16px; }

        .prod-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; }

        .prod-admin-card { background:var(--card); border:1px solid var(--border2); border-radius:14px; overflow:hidden; transition:border-color 0.2s; }
        .prod-admin-card:hover { border-color:rgba(74,158,202,0.35); }

        .prod-admin-img { width:100%; height:140px; object-fit:cover; background:var(--bg3); display:block; }
        .prod-admin-img-placeholder { width:100%; height:140px; background:var(--bg3); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; color:var(--text2); font-size:0.78rem; }
        .prod-admin-img-placeholder svg { width:32px; height:32px; opacity:0.4; }

        .prod-admin-body { padding:14px; }
        .prod-admin-top  { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:6px; }
        .prod-admin-name { font-size:0.95rem; font-weight:700; color:var(--text); line-height:1.3; flex:1; }
        .prod-admin-badge { font-size:0.6rem; font-weight:700; padding:2px 7px; border-radius:5px; background:rgba(74,158,202,0.12); color:var(--neon); border:1px solid rgba(74,158,202,0.25); white-space:nowrap; }
        .prod-admin-cat  { font-size:0.68rem; color:var(--text2); margin-bottom:4px; text-transform:uppercase; letter-spacing:0.5px; }
        .prod-admin-desc { font-size:0.76rem; color:var(--text2); line-height:1.45; margin-bottom:10px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
        .prod-admin-price{ font-size:0.95rem; font-weight:700; color:var(--neon); margin-bottom:12px; }

        .prod-admin-actions { display:flex; gap:8px; }
        .btn-edit-prod  { flex:1; padding:8px; background:rgba(74,158,202,0.1); border:1px solid rgba(74,158,202,0.25); color:var(--neon); border-radius:8px; font-family:'Space Grotesk',sans-serif; font-size:0.78rem; font-weight:600; cursor:pointer; transition:all 0.2s; }
        .btn-edit-prod:hover  { background:rgba(74,158,202,0.2); }
        .btn-del-prod   { padding:8px 14px; background:rgba(244,63,94,0.08); border:1px solid rgba(244,63,94,0.2); color:var(--error); border-radius:8px; font-family:'Space Grotesk',sans-serif; font-size:0.78rem; font-weight:600; cursor:pointer; transition:all 0.2s; }
        .btn-del-prod:hover   { background:rgba(244,63,94,0.16); }

        .prod-inactive-overlay { opacity:0.5; }
        .prod-inactive-label   { font-size:0.68rem; color:var(--error); font-weight:600; margin-bottom:4px; }

        /* ── Modal Form Produk ── */
        .prod-modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); backdrop-filter:blur(8px); z-index:10000; display:none; align-items:center; justify-content:center; padding:16px; }
        .prod-modal-overlay.open { display:flex; }
        .prod-modal { background:var(--card); border:1px solid var(--border2); border-radius:20px; width:100%; max-width:520px; max-height:90vh; overflow-y:auto; padding:28px 24px; position:relative; }
        .prod-modal-title { font-size:1.1rem; font-weight:800; margin-bottom:20px; color:var(--text); }
        .prod-modal-close { position:absolute; top:16px; right:16px; width:32px; height:32px; border:none; background:var(--bg3); border-radius:8px; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--text2); transition:all 0.2s; }
        .prod-modal-close:hover { background:rgba(244,63,94,0.15); color:var(--error); }
        .prod-modal-close svg { width:14px; height:14px; }

        /* Image upload area */
        .img-upload-area { width:100%; height:160px; border:2px dashed var(--border); border-radius:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; cursor:pointer; transition:all 0.2s; background:var(--bg3); position:relative; overflow:hidden; margin-bottom:18px; }
        .img-upload-area:hover { border-color:var(--neon); background:rgba(74,158,202,0.04); }
        .img-upload-area.has-img { border-style:solid; border-color:var(--border); }
        .img-upload-area img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; border-radius:10px; }
        .img-upload-area .upload-hint { display:flex; flex-direction:column; align-items:center; gap:6px; pointer-events:none; }
        .img-upload-area .upload-hint svg { width:28px; height:28px; color:var(--text2); }
        .img-upload-area .upload-hint span { font-size:0.8rem; color:var(--text2); }
        .img-upload-area .upload-hint small { font-size:0.7rem; color:var(--muted); }
        .img-upload-area.has-img .upload-hint { display:none; }
        #imgFileInput { display:none; }

        .img-upload-overlay { position:absolute; inset:0; background:rgba(0,0,0,0.5); display:none; align-items:center; justify-content:center; border-radius:10px; }
        .img-upload-area.has-img:hover .img-upload-overlay { display:flex; }
        .img-upload-overlay span { color:#fff; font-size:0.82rem; font-weight:600; }

        .form-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
        @media(max-width:480px){ .form-row { grid-template-columns:1fr; } }

        .form-modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:4px; }
        .btn-cancel-modal { padding:10px 22px; background:var(--bg3); border:1px solid var(--border2); color:var(--text2); border-radius:10px; font-family:'Space Grotesk',sans-serif; font-size:0.88rem; font-weight:600; cursor:pointer; }
        .btn-save-modal   { padding:10px 28px; background:linear-gradient(135deg,var(--neon),#1a5aa0); color:#fff; border:none; border-radius:10px; font-family:'Space Grotesk',sans-serif; font-size:0.88rem; font-weight:700; cursor:pointer; transition:all 0.2s; }
        .btn-save-modal:hover { opacity:0.88; }

        select option { background:var(--bg); color:var(--text); }
    </style>
    <script>!function(){var s=localStorage.getItem("gd-theme");if(s==="light")document.body.classList.add("light");}();</script>
</head>
<body>
    <!-- Admin Login -->
    <div class="admin-login" id="adminLogin">
        <div class="login-wrap">
            <div class="card">
                <div style="font-size:1.1rem;font-weight:800;color:var(--neon);letter-spacing:1px;margin-bottom:4px;">GAVIN DSN</div>
                <h2>Admin Panel</h2>
                <p>Masuk dengan password admin</p>
                <div class="alert alert-error" id="loginAlert"></div>
                <div class="form-group">
                    <label>Password Admin</label>
                    <input type="password" id="adminPass" placeholder="••••••••">
                </div>
                <button class="btn btn-primary btn-full" onclick="adminLogin()">Masuk</button>
            </div>
        </div>
    </div>

    <!-- Admin Panel -->
    <div class="admin-panel" id="adminPanel">
        <nav style="position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;gap:12px;padding:0 20px;height:60px;background:rgba(1,2,5,0.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--border2);">
            <a href="/" class="nav-logo" style="margin-right:auto;">Gavin Dsn <span style="font-size:0.68rem;background:var(--neon);color:#000;padding:2px 8px;border-radius:4px;margin-left:6px;font-weight:800;">ADMIN</span></a>
            <button class="theme-toggle" onclick="toggleTheme()">
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
            <button class="btn-sm btn-ghost" onclick="adminLogout()">Logout</button>
        </nav>

        <div class="page-wrap">
            <h1 style="font-size:1.6rem;font-weight:800;margin-bottom:20px;">Dashboard Admin</h1>

            <!-- Tab Navigation -->
            <div class="admin-tabs">
                <button class="admin-tab active" onclick="switchTab('orders', this)">Pesanan</button>
                <button class="admin-tab" onclick="switchTab('products', this)">Kelola Produk</button>
            </div>

            <!-- ══ TAB: ORDERS ══ -->
            <div id="tabOrders">
                <div class="stats-row" id="statsRow"></div>
                <div class="filter-tabs">
                    <button class="tab-btn active" onclick="filterOrders('all',this)">Semua</button>
                    <button class="tab-btn" onclick="filterOrders('pending',this)">Menunggu</button>
                    <button class="tab-btn" onclick="filterOrders('confirming',this)">Perlu Konfirmasi</button>
                    <button class="tab-btn" onclick="filterOrders('paid',this)">Selesai</button>
                    <button class="tab-btn" onclick="filterOrders('cancelled',this)">Dibatalkan</button>
                </div>
                <div id="orderList"><div class="empty-box"><p>Memuat...</p></div></div>
            </div>

            <!-- ══ TAB: PRODUCTS ══ -->
            <div id="tabProducts">
                <div class="prod-toolbar">
                    <div style="font-size:0.85rem;color:var(--text2);" id="prodCount"></div>
                    <button class="btn-add-prod" onclick="openProdModal()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                        Tambah Produk
                    </button>
                </div>
                <div class="prod-grid" id="prodGrid">
                    <div class="empty-box"><p>Memuat produk...</p></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Image Modal (bukti) -->
    <div class="img-modal" id="imgModal" onclick="closeImgModal()">
        <img id="modalImg" src="" alt="Bukti Transfer">
    </div>

    <!-- ══ PRODUCT FORM MODAL ══ -->
    <div class="prod-modal-overlay" id="prodModalOverlay">
        <div class="prod-modal">
            <div class="prod-modal-title" id="prodModalTitle">Tambah Produk</div>
            <button class="prod-modal-close" onclick="closeProdModal()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>

            <input type="hidden" id="editProdId">

            <!-- Image Upload -->
            <label style="font-size:0.78rem;font-weight:600;color:var(--text2);letter-spacing:0.5px;margin-bottom:8px;display:block;">Foto Produk</label>
            <div class="img-upload-area" id="imgUploadArea" onclick="document.getElementById('imgFileInput').click()">
                <img id="imgPreview" src="" alt="" style="display:none;">
                <div class="upload-hint">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                    <span>Klik untuk upload foto</span>
                    <small>JPG, PNG, WebP — maks 5MB</small>
                </div>
                <div class="img-upload-overlay"><span>Ganti Foto</span></div>
            </div>
            <input type="file" id="imgFileInput" accept="image/*" onchange="handleImgUpload(event)">

            <!-- Form Fields -->
            <div class="form-group">
                <label>Nama Produk *</label>
                <input type="text" id="fName" placeholder="Contoh: Items Adder Premium">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Kategori</label>
                    <select id="fCat" onchange="autoCatLabel()">
                        <option value="plugin">Plugin</option>
                        <option value="asset">Asset</option>
                        <option value="jasa">Jasa</option>
                        <option value="backup">Backup</option>
                        <option value="other">Lainnya</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Label Kategori</label>
                    <input type="text" id="fCatLabel" placeholder="Plugin">
                </div>
            </div>

            <div class="form-group">
                <label>Deskripsi</label>
                <textarea id="fDesc" rows="3" placeholder="Deskripsi singkat produk..."></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Harga (tampil) *</label>
                    <input type="text" id="fPrice" placeholder="Rp 20.000">
                </div>
                <div class="form-group">
                    <label>Harga (angka)</label>
                    <input type="number" id="fRawPrice" placeholder="20000">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Badge</label>
                    <select id="fBadge">
                        <option value="">Tidak ada</option>
                        <option value="HOT">HOT</option>
                        <option value="NEW">NEW</option>
                        <option value="SALE">SALE</option>
                        <option value="PRO">PRO</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="fActive">
                        <option value="true">Aktif (tampil)</option>
                        <option value="false">Nonaktif (sembunyikan)</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Link Download / WA</label>
                <input type="text" id="fDownload" placeholder="https://drive.google.com/... atau https://wa.me/...">
            </div>

            <div class="form-modal-actions">
                <button class="btn-cancel-modal" onclick="closeProdModal()">Batal</button>
                <button class="btn-save-modal" onclick="saveProd()">Simpan Produk</button>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = 'gavindsn2024';
        const WA_NUMBER = '6282298673652';

        let allOrders  = [];
        let allProducts = [];
        let currentImgBase64 = '';
        let editingProdId = null;

        /* ── Auth ── */
        function adminLogin() {
            const pass = document.getElementById('adminPass').value;
            if (pass === ADMIN_PASSWORD) {
                sessionStorage.setItem('adminAuth','1');
                document.getElementById('adminLogin').style.display = 'none';
                document.getElementById('adminPanel').style.display  = 'block';
                loadOrders(); loadProducts();
            } else {
                const el = document.getElementById('loginAlert');
                el.textContent = 'Password salah!'; el.style.display = 'block';
            }
        }
        function adminLogout() { sessionStorage.removeItem('adminAuth'); location.reload(); }
        document.getElementById('adminPass').addEventListener('keydown', e => { if(e.key==='Enter') adminLogin(); });
        if (sessionStorage.getItem('adminAuth') === '1') {
            document.getElementById('adminLogin').style.display = 'none';
            document.getElementById('adminPanel').style.display  = 'block';
            loadOrders(); loadProducts();
        }

        /* ── Theme ── */
        function toggleTheme() {
            const isLight = document.body.classList.toggle('light');
            localStorage.setItem('gd-theme', isLight ? 'light' : 'dark');
        }

        /* ── Tab switch ── */
        function switchTab(tab, btn) {
            document.querySelectorAll('.admin-tab').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('tabOrders').style.display   = tab === 'orders'   ? '' : 'none';
            document.getElementById('tabProducts').style.display = tab === 'products' ? '' : 'none';
        }
        document.getElementById('tabOrders').style.display   = '';
        document.getElementById('tabProducts').style.display = 'none';

        /* ══════════════════════════════
           ORDERS
           ══════════════════════════════ */
        function fmt(d) { return new Date(d).toLocaleString('id-ID',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }

        function statusBadge(s) {
            return { pending:['badge-warning','Menunggu Bukti'], confirming:['badge-blue','Perlu Konfirmasi'], paid:['badge-success','Selesai'], cancelled:['badge-error','Dibatalkan'] }[s] || ['badge-warning','Menunggu'];
        }

        function renderStats(orders) {
            const total   = orders.length;
            const confirm = orders.filter(o=>o.status==='confirming').length;
            const paid    = orders.filter(o=>o.status==='paid').length;
            const pending = orders.filter(o=>o.status==='pending').length;
            document.getElementById('statsRow').innerHTML = `
                <div class="stat-card"><div class="num">${total}</div><div class="lbl">Total</div></div>
                <div class="stat-card"><div class="num" style="color:var(--warning)">${pending}</div><div class="lbl">Menunggu</div></div>
                <div class="stat-card"><div class="num">${confirm}</div><div class="lbl">Konfirmasi</div></div>
                <div class="stat-card"><div class="num" style="color:var(--success)">${paid}</div><div class="lbl">Selesai</div></div>`;
        }

        function renderOrders(orders) {
            const list = document.getElementById('orderList');
            if (!orders.length) { list.innerHTML = `<div class="empty-box"><p>Tidak ada pesanan</p></div>`; return; }
            list.innerHTML = orders.map(o => {
                const [bc,bl] = statusBadge(o.status);
                const payLabel = { dana:'Dana', gopay:'GoPay', qris:'QRIS' }[o.paymentMethod] || o.paymentMethod;
                const hasBukti = o.buktiUrl && o.buktiUrl.startsWith('data:image');
                const actionBtns = o.status === 'confirming' ? `
                    <button class="btn-approve" onclick="approveOrder('${o.orderId}')">Approve</button>
                    <button class="btn-reject"  onclick="rejectOrder('${o.orderId}')">Tolak</button>
                    <button class="btn-wa-buyer" onclick="contactBuyer('${o.username}','${o.orderId}','${o.productName}')">WA Pembeli</button>
                ` : o.status === 'paid' ? `<span class="approved-badge">Sudah Diapprove</span>` : '';
                return `
                <div class="order-card" id="card-${o.orderId}">
                    <div class="order-head">
                        <div><div class="order-id-txt">${o.orderId}</div><div class="order-date">${fmt(o.createdAt)}</div></div>
                        <span class="badge ${bc}">${bl}</span>
                    </div>
                    <div class="order-body">
                        <div class="order-info-grid">
                            <div class="order-info-item"><div class="order-info-label">Pembeli</div><div class="order-info-value">${o.username}</div></div>
                            <div class="order-info-item"><div class="order-info-label">Produk</div><div class="order-info-value">${o.productName}</div></div>
                            <div class="order-info-item"><div class="order-info-label">Harga</div><div class="order-info-value" style="color:var(--neon)">${o.price}</div></div>
                            <div class="order-info-item"><div class="order-info-label">Metode</div><div class="order-info-value">${payLabel}</div></div>
                        </div>
                        <div class="bukti-wrap">
                            <h4>Bukti Transfer</h4>
                            ${hasBukti ? `<img class="bukti-img" src="${o.buktiUrl}" alt="Bukti" onclick="openImgModal('${o.orderId}')">` : `<div class="no-bukti">Belum ada bukti transfer</div>`}
                        </div>
                        ${actionBtns ? `<div class="action-buttons">${actionBtns}</div>` : ''}
                    </div>
                </div>`;
            }).join('');
        }

        function filterOrders(status, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderOrders(status === 'all' ? allOrders : allOrders.filter(o => o.status === status));
        }

        async function _doApprove(orderId) {
            const res  = await fetch('/api/admin/approve', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({orderId}) });
            const data = await res.json();
            if (data.success) { showToast('Pesanan diapprove!', 'success'); loadOrders(); }
        }
        async function _doReject(orderId) {
            const res  = await fetch('/api/admin/reject', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({orderId}) });
            const data = await res.json();
            if (data.success) { showToast('Pesanan ditolak.', 'warning'); loadOrders(); }
        }
        function approveOrder(id) { if(confirm('Approve pesanan ' + id + '?')) _doApprove(id); }
        function rejectOrder(id)  { if(confirm('Tolak pesanan '   + id + '?')) _doReject(id);  }

        function contactBuyer(username, orderId, productName) {
            const msg = encodeURIComponent(`Halo ${username}!\n\nKami dari Gavin Dsn ingin mengkonfirmasi pesanan kamu:\n\nOrder ID: ${orderId}\nProduk: ${productName}\n\nPembayaran sudah kami terima dan sedang diproses. Terima kasih!`);
            window.open(`https://wa.me/?text=${msg}`, '_blank');
        }

        function openImgModal(orderId) {
            const order = allOrders.find(o => o.orderId === orderId);
            if (!order || !order.buktiUrl) return;
            document.getElementById('modalImg').src = order.buktiUrl;
            document.getElementById('imgModal').classList.add('open');
        }
        function closeImgModal() { document.getElementById('imgModal').classList.remove('open'); }

        async function loadOrders() {
            try {
                const data = await fetch('/api/admin/orders').then(r=>r.json());
                allOrders = data.orders || [];
                renderStats(allOrders); renderOrders(allOrders);
            } catch { document.getElementById('orderList').innerHTML = '<div class="empty-box"><p>Gagal memuat data.</p></div>'; }
        }

        /* ══════════════════════════════
           PRODUCTS
           ══════════════════════════════ */
        async function loadProducts() {
            try {
                const data = await fetch('/api/admin/products').then(r=>r.json());
                allProducts = data.products || [];
                renderProducts();
            } catch { document.getElementById('prodGrid').innerHTML = '<div class="empty-box"><p>Gagal memuat produk.</p></div>'; }
        }

        function renderProducts() {
            const grid = document.getElementById('prodGrid');
            document.getElementById('prodCount').textContent = allProducts.length + ' produk';
            if (!allProducts.length) { grid.innerHTML = '<div class="empty-box"><p>Belum ada produk. Klik "Tambah Produk".</p></div>'; return; }
            grid.innerHTML = allProducts.map(p => {
                const isInactive = p.active === false;
                const imgEl = p.img
                    ? `<img class="prod-admin-img" src="${p.img}" alt="${p.name}" onerror="this.style.display='none';this.nextSibling.style.display='flex'">`
                    : '';
                const placeholder = `<div class="prod-admin-img-placeholder" style="${p.img?'display:none':''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg><span>Belum ada foto</span></div>`;
                return `
                <div class="prod-admin-card ${isInactive?'prod-inactive-overlay':''}">
                    ${imgEl}${placeholder}
                    <div class="prod-admin-body">
                        ${isInactive ? '<div class="prod-inactive-label">NONAKTIF</div>' : ''}
                        <div class="prod-admin-top">
                            <div class="prod-admin-name">${p.name}</div>
                            ${p.badge ? `<span class="prod-admin-badge">${p.badge}</span>` : ''}
                        </div>
                        <div class="prod-admin-cat">${p.catLabel || p.cat}</div>
                        <div class="prod-admin-desc">${p.desc || '—'}</div>
                        <div class="prod-admin-price">${p.price}</div>
                        <div class="prod-admin-actions">
                            <button class="btn-edit-prod" onclick="openProdModal(${p.id})">Edit</button>
                            <button class="btn-del-prod"  onclick="deleteProd(${p.id})">Hapus</button>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        /* ── Modal helpers ── */
        function openProdModal(id) {
            editingProdId = id || null;
            currentImgBase64 = '';
            clearForm();

            if (id) {
                const p = allProducts.find(x => x.id === id);
                if (!p) return;
                document.getElementById('prodModalTitle').textContent = 'Edit Produk';
                document.getElementById('fName').value     = p.name       || '';
                document.getElementById('fCat').value      = p.cat        || 'plugin';
                document.getElementById('fCatLabel').value = p.catLabel   || '';
                document.getElementById('fDesc').value     = p.desc       || '';
                document.getElementById('fPrice').value    = p.price      || '';
                document.getElementById('fRawPrice').value = p.rawPrice   || '';
                document.getElementById('fBadge').value    = p.badge      || '';
                document.getElementById('fActive').value   = p.active === false ? 'false' : 'true';
                document.getElementById('fDownload').value = p.downloadLink || '';
                if (p.img) {
                    currentImgBase64 = p.img;
                    setImgPreview(p.img);
                }
            } else {
                document.getElementById('prodModalTitle').textContent = 'Tambah Produk';
            }
            document.getElementById('prodModalOverlay').classList.add('open');
        }

        function closeProdModal() {
            document.getElementById('prodModalOverlay').classList.remove('open');
            editingProdId = null; currentImgBase64 = '';
        }

        function clearForm() {
            ['fName','fDesc','fPrice','fRawPrice','fDownload','fCatLabel'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('fCat').value    = 'plugin';
            document.getElementById('fBadge').value  = '';
            document.getElementById('fActive').value = 'true';
            resetImgPreview();
        }

        function setImgPreview(src) {
            const area    = document.getElementById('imgUploadArea');
            const preview = document.getElementById('imgPreview');
            preview.src   = src; preview.style.display = 'block';
            area.classList.add('has-img');
        }
        function resetImgPreview() {
            const area    = document.getElementById('imgUploadArea');
            const preview = document.getElementById('imgPreview');
            preview.src   = ''; preview.style.display = 'none';
            area.classList.remove('has-img');
        }

        function handleImgUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            if (file.size > 5 * 1024 * 1024) { showToast('Ukuran foto max 5MB!', 'error'); return; }
            const reader = new FileReader();
            reader.onload = ev => { currentImgBase64 = ev.target.result; setImgPreview(ev.target.result); };
            reader.readAsDataURL(file);
        }

        function autoCatLabel() {
            const cat = document.getElementById('fCat').value;
            const map = { plugin:'Plugin', asset:'Asset', jasa:'Jasa', backup:'Backup', other:'Lainnya' };
            document.getElementById('fCatLabel').value = map[cat] || '';
        }

        async function saveProd() {
            const name     = document.getElementById('fName').value.trim();
            const price    = document.getElementById('fPrice').value.trim();
            if (!name || !price) { showToast('Nama dan harga wajib diisi!', 'error'); return; }

            const payload = {
                name,
                cat:         document.getElementById('fCat').value,
                catLabel:    document.getElementById('fCatLabel').value || document.getElementById('fCat').value,
                desc:        document.getElementById('fDesc').value.trim(),
                price,
                rawPrice:    Number(document.getElementById('fRawPrice').value) || 0,
                badge:       document.getElementById('fBadge').value,
                active:      document.getElementById('fActive').value === 'true',
                downloadLink:document.getElementById('fDownload').value.trim(),
                img:         currentImgBase64,
            };

            try {
                let res;
                if (editingProdId) {
                    res = await fetch('/api/admin/products/' + editingProdId, { method:'PUT',  headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
                } else {
                    res = await fetch('/api/admin/products',                  { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
                }
                const data = await res.json();
                if (data.success) {
                    showToast(editingProdId ? 'Produk diupdate!' : 'Produk ditambahkan!', 'success');
                    closeProdModal(); loadProducts();
                } else { showToast(data.message || 'Gagal menyimpan', 'error'); }
            } catch { showToast('Terjadi kesalahan koneksi', 'error'); }
        }

        async function deleteProd(id) {
            const p = allProducts.find(x => x.id === id);
            if (!confirm('Hapus produk "' + (p?.name || id) + '"?')) return;
            try {
                const data = await fetch('/api/admin/products/' + id, { method:'DELETE' }).then(r=>r.json());
                if (data.success) { showToast('Produk dihapus', 'success'); loadProducts(); }
                else showToast(data.message || 'Gagal menghapus', 'error');
            } catch { showToast('Terjadi kesalahan koneksi', 'error'); }
        }

        /* ── Toast ── */
        function showToast(msg, type) {
            let t = document.getElementById('adminToast');
            if (!t) {
                t = document.createElement('div'); t.id = 'adminToast';
                t.style.cssText = 'position:fixed;bottom:24px;right:20px;z-index:99999;padding:12px 20px;border-radius:10px;font-family:Space Grotesk,sans-serif;font-size:0.88rem;font-weight:600;transition:all 0.3s;pointer-events:none;';
                document.body.appendChild(t);
            }
            const colors = { success:'rgba(34,197,94,0.12)', error:'rgba(244,63,94,0.12)', warning:'rgba(245,158,11,0.12)' };
            const borders = { success:'rgba(34,197,94,0.3)', error:'rgba(244,63,94,0.3)', warning:'rgba(245,158,11,0.3)' };
            const textC   = { success:'#22c55e', error:'#f43f5e', warning:'#f59e0b' };
            t.style.background = colors[type] || colors.success;
            t.style.border     = '1px solid ' + (borders[type] || borders.success);
            t.style.color      = textC[type]  || textC.success;
            t.style.backdropFilter = 'blur(8px)';
            t.textContent = msg; t.style.opacity = '1';
            clearTimeout(t._timer);
            t._timer = setTimeout(() => { t.style.opacity = '0'; }, 2800);
        }

        /* Close modal on overlay click */
        document.getElementById('prodModalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeProdModal();
        });
    </script>
    <script src="/zenodialog.js"></script>
</body>
</html>
